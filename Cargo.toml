[workspace]
members = [
    "cli",
    "sdk",
]
# The guest program builds separately for the riscv32im-risc0-zkvm-elf target
# (its own .cargo/config.toml carries the guest rustflags):
#   cd programs/multisig && cargo +risc0 build --release --target riscv32im-risc0-zkvm-elf
exclude = ["programs/multisig"]
resolver = "2"
